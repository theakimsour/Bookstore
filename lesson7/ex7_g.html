<!DOCTYPE html>
<html>
    <head>
        <style>
            .pic{
                object-fit: cover;
                border-radius: 200px;
                width: 35px;
                height: 35px;
                vertical-align: middle;
            }
            .search-bar{
                border: none;
                font-family: arial;
                padding-bottom: 5px;
                padding-top: 5px;
                padding-right: 20px;
                padding-left: 5px;
                margin-right:5px ;
                vertical-align: middle;
                border-radius: 5px;
            }
            .tweet-bar{
                font-family: arial;
                font-weight: bold;
                background-color: rgb(92, 92, 255);
                color: white;
                border: none;
                border-radius: 25px;
                padding-top:7px ;
                padding-bottom:7px ;
                padding-right:10px ;
                padding-left:10px ;
                vertical-align: middle;
            }
        </style>
    </head>
    <body>
        <img class="pic" src="boachsork.jpg">
        <input class="search-bar" type="text" placeholder="What's happening?">
        <button class="tweet-bar">Tweet</button>
    </body>
</html>
